{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% trans 'Synterra — создаём веб-приложения любой сложности и внедряем AI-решения для вашего бизнеса.' %}">
    <title>{% block title %}{% trans "Synterra" %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=4">
    <link rel="stylesheet" href="{% static 'css/components.css' %}?v=4">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}?v=4">
</head>
<body>
    {% include 'core/partials/navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'core/partials/footer.html' %}

    <script src="{% static 'js/main.js' %}?v=3"></script>
</body>
</html>
